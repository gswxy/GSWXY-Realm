name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "versions/upstream.json"
      - "scripts/**"
      - "manager/**"
      - "config-schema/**"
      - "locale/zhCN/**"
      - "fnos/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: 编译 Core + Playerbots 并打包 FPK
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本锁
        id: lock
        run: |
          echo "core=$(python3 -c "import json;print(json.load(open('versions/upstream.json'))['core']['commit'])")" >> "$GITHUB_OUTPUT"
          echo "pb=$(python3 -c "import json;print(json.load(open('versions/upstream.json'))['playerbots']['commit'])")" >> "$GITHUB_OUTPUT"

      - name: 拉取上游源码（锁定 SHA）
        run: bash scripts/fetch-upstream.sh build/src

      - name: 安装 GCC 13（toolchain PPA）
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-13 g++-13

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git build-essential cmake ninja-build ccache patchelf libncurses5 libtinfo5 \
            libboost-all-dev libssl-dev \
            libmysqlclient-dev libreadline-dev zlib1g-dev libbz2-dev p7zip-full

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ steps.lock.outputs.core }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.lock.outputs.core }}-
            ccache-

      - name: 编译 Core + Playerbots
        env:
          CC: gcc-13
          CXX: g++-13
        run: bash scripts/build-core.sh

      - name: 构建 Manager
        run: bash scripts/build-manager.sh

      - name: 生成 Config Schema
        run: |
          python3 config-schema/generator/generate.py \
            --src build/src --out config-schema/generated/config-schema.json --out-zh config-schema/generated/config-schema.zh.json --translations config-schema/translations/zhCN.json

      - name: 收集运行时（含 MariaDB / WebUI / locale）
        env:
          GSRM_CACHE: /tmp/gsrm-cache
        run: bash scripts/collect-runtime.sh

      - name: 生成 build-info.json
        env:
          GSRM_RUN_ID: ${{ github.run_id }}
        run: |
          # nightly 版本 = manifest 版本 + -nightly.<run_number>，
          # 并同步改写工作区 manifest，保证 FPK 文件名 / manifest /
          # build-info.json 三者一致（verify-package.sh 会校验）。
          BASE=$(python3 - <<'EOF'
          import re
          m = re.search(r'version="([^"]+)"', open("fnos/manifest", encoding="utf8").read())
          print(m.group(1))
          EOF
          )
          VERSION="${BASE}-nightly.${{ github.run_number }}"
          python3 - "$VERSION" <<'EOF'
          import re, sys
          v = sys.argv[1]
          p = "fnos/manifest"
          s = open(p, encoding="utf8").read()
          s = re.sub(r'(?m)^version="[^"]*"', f'version="{v}"', s)
          open(p, "w", encoding="utf8").write(s)
          print("manifest version ->", v)
          EOF
          echo "GSRM_VERSION=$VERSION" >> "$GITHUB_ENV"
        # GSRM_CHANNEL 固定 nightly：nightly 绝不冒充稳定版
      - name: 写入版本环境
        run: echo "GSRM_CHANNEL=nightly" >> "$GITHUB_ENV"

      - name: 生成 build-info（使用统一版本）
        env:
          GSRM_VERSION: ${{ env.GSRM_VERSION }}
          GSRM_CHANNEL: ${{ env.GSRM_CHANNEL }}
          GSRM_RUN_ID: ${{ github.run_id }}
        run: bash scripts/gen-build-info.sh

      - name: Smoke 测试
        run: bash scripts/smoke-test.sh

      - name: 构建 FPK
        env:
          GSRM_CACHE: /tmp/gsrm-cache
        run: bash scripts/build-fpk.sh

      - name: 验证 FPK
        run: bash scripts/verify-package.sh dist/GSWXY-Realm-*.fpk

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSWXY-Realm-fpk
          path: |
            dist/*.fpk
            dist/*.sha256
            fnos/app/build-info.json
          retention-days: 14
